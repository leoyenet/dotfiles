# Use backtick as the prefix. Press it twice to type a literal backtick.
unbind C-b
set -g prefix '`'
bind '`' send-prefix

# Start window and pane numbering at 1; close gaps when windows are removed.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
source-file -q "$XDG_CONFIG_HOME/tmux/themes/noctalia.conf"
